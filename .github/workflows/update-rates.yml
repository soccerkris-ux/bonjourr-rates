name: Update rates

on:
  workflow_dispatch:
  schedule:
    - cron: "23 14,18,22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest rates
        run: python update_rates.py

      - name: Save updated rates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.csv
          if git diff --cached --quiet; then
            echo "Rates have not changed."
          else
            git commit -m "Update SOFR and Prime rates"
            git push
          fi
